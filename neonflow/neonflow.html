<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeonFlow — Traffic Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: pitch de startup com cara de pôster de jogo — confiante, noturno, divertido, mas números sérios.
   IDEA: um "mapa de missão" neon de Miami Beach (a Vice City real) onde o tráfego é o personagem.
   PICTURE: pôr do sol listrado + mapa vivo com carros andando pelas ruas, cores = ocupação da via.
   COLOUR and TYPE: noite violeta, rosa-choque, laranja-pôr-do-sol, turquesa; Anton para títulos, Inter no corpo.
   LAYOUT: Pitch em telas cheias com rolagem por slide; Planejador = ferramentas | mapa | painel. */
:root{color-scheme:dark;--bg:#120821;--deep:#1c0e36;--panel:#21113f;--line:#3a2566;--ink:#fff4f9;--mute:#c9b6e4;
--pink:#ff3d8b;--orange:#ff8a3d;--sun:#ffc15e;--teal:#22e1c9;--violet:#7b4bd6;--idle:#6a5890}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.top{height:56px;display:flex;align-items:center;gap:16px;padding:0 max(2vw,12px);background:#0c0518;border-bottom:1px solid var(--line);position:relative;z-index:5}
.logo{font-family:Anton,sans-serif;font-size:26px;letter-spacing:.04em;background:linear-gradient(90deg,var(--pink),var(--orange) 60%,var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.top nav{display:flex;gap:6px;margin-left:auto}
.top nav a{padding:9px 16px;border-radius:999px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px;border:1px solid transparent}
.top nav a[aria-current]{color:#1a0b2e;background:var(--sun)}
.top .live{font-size:13px;color:var(--mute);white-space:nowrap}
.top .live b{color:var(--teal);font-size:15px}
main{height:calc(100% - 56px)}
.view{height:100%;display:none}.view.on{display:block}
/* ---------- PLANEJADOR ---------- */
#app.on{display:grid;grid-template-columns:84px minmax(0,1fr) 390px;height:100%}
.tools{background:#0c0518;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow-y:auto}
.tools button{background:transparent;border:1px solid transparent;border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mute);min-height:58px}
.tools button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools button:hover{background:var(--deep);color:var(--ink)}
.tools button.on{background:var(--pink);color:#fff}
.tools hr{border:0;border-top:1px solid var(--line);margin:6px 4px;width:calc(100% - 8px)}
.tools kbd{font:600 10px Inter;opacity:.7}
.mapwrap{position:relative;overflow:hidden;background:#0b2440}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;cursor:crosshair}
#map.sel{cursor:default}#map.pan{cursor:grabbing}
.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;pointer-events:none}
.hud>*{pointer-events:auto}
.flowbox{background:rgba(12,5,24,.88);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.flowbox small{color:var(--mute);font-size:13px;display:block}
.flowbox b{font-family:Anton,sans-serif;font-weight:400;font-size:38px;line-height:1;color:var(--teal);white-space:nowrap}
.flowbox b.warn{color:var(--pink)}
.flowbox .sub{font-size:13px;color:var(--mute);margin-top:4px}
.flowbox .sub b{font:700 14px Inter;color:var(--sun)}
.seg{display:inline-flex;background:rgba(12,5,24,.88);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute);min-height:38px}
.seg button.on{background:var(--violet);color:#fff}
.legend{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mute)}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:5px}
.hint{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.hint>div{background:rgba(12,5,24,.88);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;pointer-events:auto}
.hint .z{display:flex;gap:4px;padding:4px}
.hint .z button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--deep);font-weight:700}
.banner{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:var(--pink);color:#fff;font-weight:700;padding:8px 16px;border-radius:999px;font-size:14px;display:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.banner.on{display:block}.banner.b{background:var(--teal);color:#0b1a24}.banner.s{background:var(--sun);color:#24082f}
.side{background:var(--deep);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:#160a2b}
.tabs button{border:0;background:transparent;color:var(--mute);border-radius:8px;padding:7px 9px;font-size:13.5px;font-weight:600;min-height:36px}
.tabs button.on{background:var(--panel);color:var(--sun)}
.pane{padding:16px 16px 40px;overflow-y:auto;flex:1}
.pane h3{font-size:24px;margin-bottom:6px}
.pane p,.pane li{color:var(--mute);font-size:14.5px}
.pane .note{font-size:13px;color:var(--mute);background:var(--panel);border-radius:10px;padding:10px 12px;margin:12px 0}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px;font-weight:600}
.in-t,select.in-t{width:100%;min-height:44px;background:#120822;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:15px;min-height:30px}
.chk input{width:20px;height:20px;accent-color:var(--pink)}
.b2{min-height:44px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14.5px}
.b2.p{background:var(--pink);border-color:var(--pink);color:#fff}
.b2.t{background:var(--teal);border-color:var(--teal);color:#0b1a24}
.b2:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
th{text-align:left;color:var(--mute);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);padding:6px 4px}
td{border-bottom:1px solid rgba(58,37,102,.6);padding:7px 4px;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.hl td{background:rgba(255,61,139,.14)}
tr.best td{background:rgba(34,225,201,.16)}
tr.cl{cursor:pointer}tr.cl:hover td{background:rgba(255,193,94,.1)}
.res{background:var(--panel);border-radius:14px;padding:14px;margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res div small{display:block;color:var(--mute);font-size:12.5px}
.res div b{font-family:Anton,sans-serif;font-weight:400;font-size:28px;white-space:nowrap}
.res .wide{grid-column:1/-1}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--line);white-space:nowrap}
.pill.s{background:var(--pink);color:#fff}.pill.o{background:var(--teal);color:#0b1a24}.pill.d{background:var(--sun);color:#24082f}
.ok{color:var(--teal);font-weight:700}
.path{font-size:13px;line-height:1.45;color:var(--ink)}
.path .bk{color:var(--sun)}
textarea.in-t{min-height:130px;font:12px/1.4 ui-monospace,monospace}
.range{width:100%;accent-color:var(--pink)}
svg text{font-family:Inter,sans-serif}
.car{animation:dash linear infinite}
@keyframes dash{to{stroke-dashoffset:-36}}
.satpulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.car,.satpulse,.anim{animation:none!important}#pitch{scroll-behavior:auto}}
@media (max-width:1100px){#app.on{grid-template-columns:72px minmax(0,1fr) 330px}}
@media (max-width:860px){
 body{overflow:auto}main{height:auto}.view.on{height:auto}
 #pitch{height:auto;overflow:visible;scroll-snap-type:none}.slide{min-height:auto}.hero{min-height:92vh}
 #app.on{display:flex;flex-direction:column}
 .tools{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.tools button{min-width:64px}.tools hr{display:none}
 .mapwrap{height:68vh}.side{border-left:0}.pane{overflow:visible}
 .grid3,.stats,.finds,.howto{grid-template-columns:minmax(0,1fr)}
 .legend{display:none}.pnav{display:none}.top .live{display:none}
 .bigstat{position:relative;right:auto;bottom:auto;margin:0 max(6vw,18px) 28px;display:inline-block}
}
@media (max-width:600px){.hint>div:first-child,.legend,.flowbox .sub{display:none}.hint{justify-content:flex-end}.banner{white-space:normal;text-align:center;border-radius:14px}.seg button{padding:6px 8px;font-size:12.5px}.flowbox{padding:8px 12px}.flowbox b{font-size:30px}.hint .k{display:none}.logo{font-size:22px}.top nav a{padding:8px 11px}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">NEONFLOW</div>
  <span class="live">Fluxo máximo agora: <b id="liveFlow">—</b> veíc/h</span>
  <span class="live" style="margin-left:auto">Traffic Planning · Ford-Fulkerson</span>
</header>
<main>
<!-- ================= PLANEJADOR ================= -->
<section id="app" class="view on" aria-label="Planejador de tráfego">
  <div class="tools" id="tools"></div>
  <div class="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridP" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a2566" stroke-width=".6" opacity=".6"/></pattern>
        <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#ff3d8b"/></pattern>
        <radialGradient id="glowS"><stop offset="0" stop-color="#ff3d8b" stop-opacity=".6"/><stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/></radialGradient>
        <radialGradient id="glowT"><stop offset="0" stop-color="#22e1c9" stop-opacity=".55"/><stop offset="1" stop-color="#22e1c9" stop-opacity="0"/></radialGradient>
      </defs>
      <g id="vp"><g id="gBase"></g><g id="gBg"></g><g id="gRoads"></g><g id="gLabels"></g><g id="gNodes"></g><line id="prev" pointer-events="none" stroke="#ffc15e" stroke-width="3" stroke-dasharray="8 6" visibility="hidden"/></g>
    </svg>
    <div class="hud">
      <div class="flowbox"><small id="fbT">Fluxo máximo (origem → destino)</small><b id="fbV">—</b> <span style="color:var(--mute)">veíc/h</span><div class="sub" id="fbS"></div><div class="legend"><span><i style="background:var(--idle)"></i>sem fluxo</span><span><i style="background:var(--teal)"></i>&lt; 60%</span><span><i style="background:var(--sun)"></i>60–90%</span><span><i style="background:var(--orange)"></i>90–99%</span><span><i style="background:var(--pink)"></i>saturada (c<sub>f</sub>=0)</span></div></div>
      <div class="seg" role="group" aria-label="Busca do caminho aumentante"><button data-m="dfs">DFS · Ford-Fulkerson</button><button data-m="bfs">BFS · Edmonds-Karp</button></div>
      
    </div>
    <div class="banner" id="banner"></div>
    <div class="hint"><div id="hint"></div><div class="z"><button id="zIn" aria-label="Aproximar">+</button><button id="zOut" aria-label="Afastar">−</button><button id="zFit" aria-label="Enquadrar mapa">⤢</button></div></div>
  </div>
  <aside class="side">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="pane" id="pane"></div>
  </aside>
</section>
</main>
<input type="file" id="fileBg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<script>
/* ===== NÚCLEO: Ford-Fulkerson do zero, com rede residual explícita ===== */
const TIPOS = {
  local: { nome: 'Via local (1 faixa)', cap: 600 },
  col:   { nome: 'Coletora (2 faixas)', cap: 1200 },
  av2:   { nome: 'Avenida 2 faixas', cap: 1600 },
  av3:   { nome: 'Avenida 3 faixas', cap: 2400 },
  exp:   { nome: 'Via expressa / ponte (4 faixas)', cap: 3200 },
  custom:{ nome: 'Personalizada', cap: null }
};
const INF = 1e9;

/* Cada rua (road) vira 1 arco (mão única) ou 2 arcos (mão dupla), cada um com c(u,v). */
function arcosDe(model, over) {
  over = over || {};
  const out = [];
  for (const r of model.roads) {
    const f = r.id + '>', b = r.id + '<';
    out.push({ id: f, road: r.id, u: r.u, v: r.v, cap: f in over ? over[f] : r.cap });
    if (r.twoWay) out.push({ id: b, road: r.id, u: r.v, v: r.u, cap: b in over ? over[b] : r.cap });
  }
  return out;
}

/* Rede residual: lista de adjacência com par (aresta, aresta reversa).
   Para cada arco u->v com c(u,v) cria-se u->v (cap c) e v->u (cap 0).
   Residual c_f(e) = cap(e) - flow(e). Na reversa, flow = -f, então c_f = f. */
class RedeResidual {
  constructor() { this.adj = new Map(); }
  no(x) { if (!this.adj.has(x)) this.adj.set(x, []); return this.adj.get(x); }
  add(u, v, cap, arc) {
    const a = { to: v, cap, flow: 0, arc, rev: null }, b = { to: u, cap: 0, flow: 0, arc: null, rev: a };
    a.rev = b; this.no(u).push(a); this.no(v).push(b);
  }
}

function caminhoDFS(R, s, t) {
  const vis = new Set(), par = new Map();
  const dfs = u => {
    if (u === t) return true;
    vis.add(u);
    for (const e of R.no(u)) if (e.cap - e.flow > 0 && !vis.has(e.to)) {
      par.set(e.to, e); if (dfs(e.to)) return true;
    }
    return false;
  };
  if (!dfs(s)) return null;
  const p = []; let v = t;
  while (v !== s) { const e = par.get(v); p.push(e); v = e.rev.to; }
  return p.reverse();
}

function caminhoBFS(R, s, t) {
  const par = new Map([[s, null]]), q = [s];
  while (q.length && !par.has(t)) {
    const u = q.shift();
    for (const e of R.no(u)) if (e.cap - e.flow > 0 && !par.has(e.to)) { par.set(e.to, e); q.push(e.to); }
  }
  if (!par.has(t)) return null;
  const p = []; let v = t;
  while (v !== s) { const e = par.get(v); p.push(e); v = e.rev.to; }
  return p.reverse();
}

/* Calcula o fluxo máximo. opts: {over, metodo:'dfs'|'bfs', historico:true} */
function fluxoMaximo(model, opts) {
  opts = opts || {};
  const S = '__S', T = '__T';
  const arcs = arcosDe(model, opts.over);
  const R = new RedeResidual();
  const fw = new Map();
  for (const a of arcs) if (a.cap > 0 && a.u !== a.v) { R.add(a.u, a.v, a.cap, a.id); fw.set(a.id, R.no(a.u)[R.no(a.u).length - 1]); }
  const fontes = model.nodes.filter(n => n.role === 'src'), sumid = model.nodes.filter(n => n.role === 'snk');
  for (const n of fontes) R.add(S, n.id, INF, null);
  for (const n of sumid) R.add(n.id, T, INF, null);
  const busca = opts.metodo === 'bfs' ? caminhoBFS : caminhoDFS;
  let total = 0; const hist = [];
  if (fontes.length && sumid.length) {
    let p, guard = 0;
    while ((p = busca(R, S, T)) && guard++ < 5000) {
      let b = Infinity; for (const e of p) b = Math.min(b, e.cap - e.flow);    // gargalo do caminho
      if (b >= INF) { total = Infinity; break; }                                  // origem ligada direto ao destino
      for (const e of p) { e.flow += b; e.rev.flow -= b; }                        // aumenta e atualiza a residual
      total += b;
      if (opts.historico) {
        const snap = {}; for (const [id, e] of fw) snap[id] = e.flow;
        hist.push({ b, nos: [p[0].rev.to, ...p.map(e => e.to)].filter(x => x !== S && x !== T),
                    passos: p.filter(e => e.arc !== null || e.rev.arc !== null).map(e => e.arc !== null ? { arc: e.arc, dir: 1 } : { arc: e.rev.arc, dir: -1 }),
                    total, snap });
      }
    }
  }
  // corte mínimo: vértices alcançáveis a partir de S na residual final
  const ladoS = new Set([S]), st = [S];
  while (st.length) { const u = st.pop(); for (const e of R.no(u)) if (e.cap - e.flow > 0 && !ladoS.has(e.to)) { ladoS.add(e.to); st.push(e.to); } }
  const flow = {}; for (const a of arcs) flow[a.id] = fw.has(a.id) ? fw.get(a.id).flow : 0;
  // em ruas de mão dupla, cancela fluxos opostos (o fluxo continua válido e máximo)
  for (const r of model.roads) if (r.twoWay) {
    const m = Math.min(flow[r.id + '>'], flow[r.id + '<']);
    if (m > 0) { flow[r.id + '>'] -= m; flow[r.id + '<'] -= m; }
  }
  const lista = arcs.map(a => ({ ...a, flow: flow[a.id], res: a.cap - flow[a.id], util: a.cap > 0 ? flow[a.id] / a.cap : 0 }));
  return {
    total, arcs: lista, hist,
    saturadas: lista.filter(a => a.cap > 0 && a.res === 0),
    corte: lista.filter(a => a.cap > 0 && ladoS.has(a.u) && !ladoS.has(a.v)),
    ladoS, nFontes: fontes.length, nSumid: sumid.length
  };
}

/* Cenário A: uma ou várias ruas afetadas ao mesmo tempo.
   afetadas = [{ road, modo: 'interditar' | 'reduzir', pct }]  (pct = % de redução, só no modo 'reduzir')
   Por compatibilidade também aceita cenarioA(model, roadId, fator, metodo). */
function overDeAfetadas(model, afetadas) {
  const over = {};
  for (const a of afetadas) {
    const r = model.roads.find(x => x.id === a.road); if (!r) continue;
    const fator = a.modo === 'interditar' ? 0 : Math.max(0, 1 - (a.pct ?? 50) / 100);
    over[r.id + '>'] = Math.floor(r.cap * fator);
    if (r.twoWay) over[r.id + '<'] = Math.floor(r.cap * fator);
  }
  return over;
}
function cenarioA(model, afetadas, a3, a4) {
  let metodo = a3;
  if (typeof afetadas === 'string') { afetadas = [{ road: afetadas, modo: a3 === 0 ? 'interditar' : 'reduzir', pct: 100 * (1 - a3) }]; metodo = a4; }
  const base = fluxoMaximo(model, { metodo }).total;
  const depois = fluxoMaximo(model, { over: overDeAfetadas(model, afetadas), metodo }).total;
  return { antes: base, depois, perda: base - depois, perdaPct: base ? 100 * (base - depois) / base : 0 };
}

/* Cenário B: testa +X em cada arco saturado e recomenda o de maior ganho real */
function cenarioB(model, X, metodo) {
  const base = fluxoMaximo(model, { metodo });
  const op = base.saturadas.map(a => {
    const novo = fluxoMaximo(model, { over: { [a.id]: a.cap + X }, metodo }).total;
    return { arc: a, novo, ganho: novo - base.total };
  }).sort((p, q) => q.ganho - p.ganho);
  return { base: base.total, opcoes: op, melhor: op.length && op[0].ganho > 0 ? op[0] : null };
}

if (typeof module !== 'undefined') module.exports = { TIPOS, fluxoMaximo, cenarioA, cenarioB, arcosDe, overDeAfetadas };

/* Recorte de South Beach, Miami Beach (FL) — a cidade real que inspira a Vice City.
   Modelo esquemático: nomes e ordem das ruas reais; posições, faixas e sentidos aproximados
   (conferir no Google Maps / OpenStreetMap). Capacidades estimadas por número de faixas. */
const MAPA_PADRAO = (() => {
  const X = { alton: 380, meridian: 500, washington: 620, collins: 720, ocean: 790 };
  const Y = { s17: 240, s14: 390, s10: 550, s5: 720 };
  const nomesAv = { alton: 'Alton Rd', meridian: 'Meridian Av', washington: 'Washington Av', collins: 'Collins Av', ocean: 'Ocean Dr' };
  const nomesRua = { s17: '17th St', s14: '14th St', s10: '10th St', s5: '5th St' };
  const nodes = [], roads = [];

function addNode(p) { const n = { id: newId('n'), name: 'Cruzamento ' + (M.nodes.length + 1), x: Math.round(p.x), y: Math.round(p.y), role: '' }; M.nodes.push(n); return n; }
function addRoad(u, v) {
  if (u === v) return null;

  if (ex) { if (!ex.twoWay && ex.u === v) ex.twoWay = true; return ex; }

}
function splitRoad(r, p) {

  const t = Math.max(.08, Math.min(.92, ((p.x - A.x) * dx + (p.y - A.y) * dy) / L2));
  const n = addNode({ x: A.x + dx * t, y: A.y + dy * t }); n.name = r.name + ' (novo cruzamento)';
  M.roads.push({ ...r, id: newId('r'), u: n.id, v: r.v }); r.v = n.id; return n;
}

    <label class="f" for="aAdd">Adicionar rua</label>
    <div style="display:flex;gap:8px"><select class="in-t" id="aAdd" style="flex:1;width:auto" ${livres.length ? '' : 'disabled'}>${livres.map(r => `<option value="${esc(r.id)}" ${r.id === st.cenA.add ? 'selected' : ''}>${esc(r.name)} — ${esc(curto(r.u))} ↔ ${esc(curto(r.v))}</option>`).join('')}</select><button class="b2 t" id="aAddB" style="flex:none" ${livres.length ? '' : 'disabled'}>Adicionar</button></div>
    <div id="aList">${L.length ? L.map((x, k) => { const r = road(x.road); return `<div class="card" style="padding:12px;margin-top:10px;border-radius:12px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><b style="font-size:14.5px">${esc(r.name)}<br><span style="font-weight:400;color:var(--mute);font-size:13px">${esc(curto(r.u))} ${r.twoWay ? '↔' : '→'} ${esc(curto(r.v))} · ${fmt(r.cap)} veíc/h</span></b><button class="b2" data-rm="${k}" aria-label="Remover da lista" style="min-height:36px;padding:4px 10px">✕</button></div>
      <label class="chk" style="margin:8px 0 2px"><input type="radio" name="aM${k}" value="interditar" data-k="${k}" ${x.modo === 'interditar' ? 'checked' : ''}> Interditar completamente (c = 0)</label>
      <label class="chk" style="margin:2px 0"><input type="radio" name="aM${k}" value="reduzir" data-k="${k}" ${x.modo === 'reduzir' ? 'checked' : ''}> Diminuir fluxo</label>
      ${x.modo === 'reduzir' ? `<div style="display:flex;align-items:center;gap:10px;margin-top:4px"><input class="range" type="range" min="10" max="90" step="5" value="${x.pct}" data-p="${k}" aria-label="Redução em %"><b style="white-space:nowrap;min-width:110px" id="aPv${k}">−${x.pct}% → ${fmt(Math.floor(r.cap * (1 - x.pct / 100)))}</b></div>` : ''}
    </div>`; }).join('') : '<p class="note">Nenhuma rua na lista ainda.</p>'}</div>
    <div class="btns"><button class="b2 p" id="aRun" ${L.length ? '' : 'disabled'}>Simular ${L.length > 1 ? L.length + ' ruas juntas' : ''}</button><button class="b2" id="aClr" ${st.cen || L.length ? '' : 'disabled'}>Limpar</button><button class="b2" id="aRank">Ranking: ruas mais críticas</button></div>
    ${R ? `<div class="res"><div><small>Antes</small><b>${fmt(R.antes)}</b></div><div><small>Depois</small><b style="color:var(--pink)">${fmt(R.depois)}</b></div><div><small>Perda</small><b>${fmt(R.perda)}</b> <small>veíc/h</small></div><div><small>Perda percentual</small><b style="color:var(--sun)">${pct(R.perdaPct / 100)}</b></div>
      <div class="wide"><small>Tempo para esvaziar ${fmt(M.evento || 0)} carros</small><b style="font-size:22px">${tempo(M.evento || 0, R.antes)} → ${tempo(M.evento || 0, R.depois)}</b></div></div>
      ${R.cada && R.cada.length > 1 ? `<table><thead><tr><th>Se fosse só esta rua</th><th class="n">Perda</th></tr></thead><tbody>${R.cada.map(c => `<tr><td>${esc(c.nome)}</td><td class="n">${pct(c.pct / 100)}</td></tr>`).join('')}<tr class="hl"><td><b>Todas juntas</b></td><td class="n"><b>${pct(R.perdaPct / 100)}</b></td></tr></tbody></table><p style="font-size:13px">Juntas, as ruas podem perder mais (ou menos) que a soma das perdas isoladas, porque os desvios se somam.</p>` : ''}` : ''}
    ${st.rank ? `<h3 style="margin-top:20px;font-size:20px">Se cada rua fosse interditada sozinha…</h3><table class="stack"><thead><tr><th>Rua</th><th class="n">Perda</th></tr></thead><tbody>${st.rank.slice(0, 10).map(x => `<tr class="cl" data-road="${esc(x.id)}"><td>${esc(x.nome)}</td><td class="n">${pct(x.pct / 100)}</td></tr>`).join('')}</tbody></table><p style="font-size:13px">Clique numa linha para adicioná-la à lista.</p>` : ''}`;
    $('#aAdd').onchange = e => st.cenA.add = e.target.value;
    $('#aAddB').onclick = () => { if (st.cenA.add) { st.cenA.lista.push({ road: st.cenA.add, modo: 'interditar', pct: 50 }); st.cenA.add = null; renderPane(); drawMap(); } };
    $$('#aList [data-rm]').forEach(b => b.onclick = () => { st.cenA.lista.splice(+b.dataset.rm, 1); renderPane(); drawMap(); });
    $$('#aList input[type=radio]').forEach(i => i.onchange = () => { st.cenA.lista[+i.dataset.k].modo = i.value; renderPane(); drawMap(); });
    $$('#aList input[data-p]').forEach(i => i.oninput = () => { const k = +i.dataset.p, x = st.cenA.lista[k], r = road(x.road); x.pct = +i.value; $('#aPv' + k).textContent = `−${x.pct}% → ${fmt(Math.floor(r.cap * (1 - x.pct / 100)))}`; });
    $('#aRun').onclick = runA;
    $('#aClr').onclick = () => { st.cen = null; st.cenA.res = null; st.cenA.lista = []; recompute(); renderAll(); };
    $('#aRank').onclick = () => { st.rank = rankCrit(); renderPane(); };
    P.querySelectorAll('tr[data-road]').forEach(t => t.onclick = () => { if (!st.cenA.lista.some(x => x.road === t.dataset.road)) st.cenA.lista.push({ road: t.dataset.road, modo: 'interditar', pct: 50 }); st.sel = { t: 'road', id: t.dataset.road }; renderPane(); drawMap(); });
    return;
  }
  if (st.tab === 'b') {
    const B = st.cenB.res;
    P.innerHTML = `<h3>Cenário B — investimento</h3><p>A prefeitura pode alargar <b>uma</b> rua em +X veíc/h. Testamos o acréscimo em cada arco saturado, recalculamos o fluxo máximo e recomendamos a obra de maior ganho real.</p>
    <label class="f" for="bX">Acréscimo X (veíc/h)</label><input class="in-t" id="bX" type="number" min="1" step="100" value="${st.cenB.X}">
    <div class="btns"><button class="b2" data-x="600">+600 (1 faixa local)</button><button class="b2" data-x="800">+800 (1 faixa avenida)</button><button class="b2" data-x="1600">+1.600</button></div>
    <div class="btns"><button class="b2 p" id="bRun">Recomendar obra</button>${B && B.melhor ? '<button class="b2 t" id="bApply">Aplicar a obra no mapa</button>' : ''}${B ? '<button class="b2" id="bClr">Limpar recomendação</button>' : ''}${undoS.length ? '<button class="b2" id="bUndo">Desfazer última obra (Ctrl+Z)</button>' : ''}</div>
    ${B ? `<div class="res">${B.melhor ? `<div class="wide"><small>Obra recomendada</small><span style="display:block;font:700 18px/1.3 Inter,sans-serif;color:var(--ink);margin-top:2px">${esc(arcLabel(B.melhor.arc))}</span></div><div><small>Fluxo hoje → depois</small><b>${fmt(B.base)} → <span style="color:var(--teal)">${fmt(B.melhor.novo)}</span></b></div><div><small>Ganho</small><b style="color:var(--teal)">+${fmt(B.melhor.ganho)}</b> <small>(${pct(B.base ? B.melhor.ganho / B.base : 0)})</small></div>` :
      `<div class="wide"><small>Resultado</small><p style="margin:4px 0 0;color:var(--ink)">Nenhuma obra isolada aumenta o fluxo: o corte mínimo tem vários arcos, então é preciso alargar mais de um ao mesmo tempo.</p></div>`}</div>
    <table class="stack"><thead><tr><th>Arco saturado testado</th><th class="n">Novo fluxo</th><th class="n">Ganho</th></tr></thead><tbody>${B.opcoes.map((o, i) => `<tr class="cl ${i === 0 && B.melhor ? 'best' : ''}" data-road="${esc(o.arc.road)}"><td>${esc(arcLabel(o.arc))}</td><td class="n">${fmt(o.novo)}</td><td class="n">${o.ganho > 0 ? '+' + fmt(o.ganho) : '0'}</td></tr>`).join('')}</tbody></table>
    <p style="margin-top:10px;font-size:13px">Só arcos do corte mínimo podem gerar ganho; empates indicam obras equivalentes.</p>` : ''}`;
    $('#bX').onchange = e => st.cenB.X = Math.max(1, Math.round(+e.target.value || 1));
    $$('[data-x]').forEach(b => b.onclick = () => { st.cenB.X = +b.dataset.x; runB(); });
    $('#bRun').onclick = runB;
    if ($('#bClr')) $('#bClr').onclick = () => { st.cen = null; st.cenB.res = null; recompute(); renderAll(); };
    if ($('#bUndo')) $('#bUndo').onclick = () => { doUndo(); st.tab = 'b'; renderTabs(); renderPane(); };
    if ($('#bApply')) $('#bApply').onclick = () => {
      const a = B.melhor.arc, r = road(a.road); snap();
      if (r.twoWay) { // separa o sentido alargado em uma rua de mão única própria
        const other = { ...r, id: newId('r'), twoWay: false, u: a.v, v: a.u }; r.twoWay = false; r.u = a.u; r.v = a.v; M.roads.push(other);
      }
      r.cap += st.cenB.X; r.tipo = 'custom'; r.name = r.name.replace(/ \(obra.*\)$/, '') + ' (obra +' + fmt(st.cenB.X) + ')'; st.sel = { t: 'road', id: r.id }; commit();
    };
    bindRowSel(P); return;
  }
  if (st.tab === 'passo') {
    const H = RES.hist, k = st.passo === null ? H.length : st.passo;
    P.innerHTML = `<h3>Passo a passo do algoritmo</h3><p>Cada linha é um caminho aumentante encontrado por ${st.metodo === 'dfs' ? 'DFS (Ford-Fulkerson clássico)' : 'BFS (Edmonds-Karp)'} na rede residual. Em <span class="path"><span class="bk">amarelo</span></span>, trechos que usam um arco reverso (desfazem fluxo antigo).</p>
    <div class="btns"><button class="b2" id="p0" aria-label="Início">⏮</button><button class="b2" id="pPrev" aria-label="Anterior">◀</button><button class="b2 p" id="pPlay">${st.play ? 'Pausar' : '▶ Animar'}</button><button class="b2" id="pNext" aria-label="Próximo">▶</button><button class="b2" id="pEnd" aria-label="Fim">⏭</button></div>
    <input class="range" type="range" id="pR" min="0" max="${H.length}" value="${k}" aria-label="Passo">
    <table><thead><tr><th>#</th><th>Caminho s → t</th><th class="n">Gargalo</th><th class="n">Total</th></tr></thead><tbody>${H.map((h, i) => `<tr class="cl ${i + 1 === st.passo ? 'best' : ''}" data-step="${i + 1}"><td>${i + 1}</td><td class="path">${h.passos.map(p => { const a = arcosDe(M).find(x => x.id === p.arc); const [u, v] = p.dir > 0 ? [a.u, a.v] : [a.v, a.u]; return `<span class="${p.dir < 0 ? 'bk' : ''}">${esc(curto(u))} → ${esc(curto(v))}</span>`; }).join('<br>')}</td><td class="n">${fmt(h.b)}</td><td class="n">${fmt(h.total)}</td></tr>`).join('')}</tbody></table>`;
    const go = n => { stopPlay(); st.passo = Math.max(0, Math.min(H.length, n)); refreshStep(); };
    $('#p0').onclick = () => go(0); $('#pEnd').onclick = () => go(H.length);
    $('#pPrev').onclick = () => go((st.passo === null ? H.length : st.passo) - 1); $('#pNext').onclick = () => go((st.passo === null ? 0 : st.passo) + 1);
    $('#pR').oninput = e => go(+e.target.value);
    $('#pPlay').onclick = () => { if (st.play) { stopPlay(); renderPane(); return; } if (st.passo === null || st.passo >= H.length) st.passo = 0; refreshStep(); st.play = setInterval(() => { if (st.passo >= H.length) { stopPlay(); renderPane(); return; } st.passo++; refreshStep(); }, 1300); renderPane(); };
    $$('#pane tr[data-step]').forEach(t => t.onclick = () => go(+t.dataset.step));
    return;
  }
  if (st.tab === 'resid') {
    P.innerHTML = `<h3>Rede residual final</h3><p>Para cada arco u→v: capacidade residual direta c<sub>f</sub>(u,v) = c − f e o arco reverso v→u com c<sub>f</sub> = f (permite "devolver" fluxo).</p>
    <label class="chk"><input type="checkbox" id="rsT" ${st.residual ? 'checked' : ''}> Desenhar a rede residual no mapa</label>
    <table class="stack"><thead><tr><th>Arco u → v</th><th class="n">c</th><th class="n">f</th><th class="n">c<sub>f</sub>(u,v)</th><th class="n">c<sub>f</sub>(v,u)</th></tr></thead><tbody>${RES.arcs.filter(a => a.cap > 0).map(a => `<tr class="cl ${a.res === 0 ? 'hl' : ''}" data-road="${esc(a.road)}"><td>${esc(arcLabel(a))}</td><td class="n">${fmt(a.cap)}</td><td class="n">${fmt(a.flow)}</td><td class="n">${fmt(a.res)}</td><td class="n">${fmt(a.flow)}</td></tr>`).join('')}</tbody></table>`;
    $('#rsT').onchange = e => { st.residual = e.target.checked; renderTools(); drawMap(); hud(); };
    bindRowSel(P); return;
  }
  if (st.tab === 'arq') {
    P.innerHTML = `<h3>Mapas e arquivos</h3>
    <div class="btns"><button class="b2 p" id="fReset">Restaurar South Beach (Miami)</button><button class="b2" id="fBlank">Começar mapa em branco</button></div>
    <label class="chk"><input type="checkbox" id="fBase" ${M.fundo !== 'nenhum' ? 'checked' : ''}> Mostrar contorno de Miami Beach ao fundo</label>
    <h3 style="margin-top:20px;font-size:20px">Imagem de fundo</h3><p>Carregue um print de mapa (Google Maps, OpenStreetMap ou o mapa de Leonida do projeto) e desenhe as ruas por cima.</p>
    <div class="btns"><button class="b2" id="fBg">Carregar imagem…</button>${st.bg ? '<button class="b2" id="fBgX">Remover imagem</button>' : ''}</div>
    ${st.bg ? `<label class="f" for="fOp">Opacidade da imagem</label><input class="range" id="fOp" type="range" min="0.1" max="1" step="0.05" value="${st.bgOp}">` : ''}
    <h3 style="margin-top:20px;font-size:20px">Exportar / importar (JSON)</h3><p>O mesmo JSON roda no verificador em Python (ford_fulkerson.py).</p>
    <div class="btns"><button class="b2" id="fCopy">Copiar JSON</button><button class="b2" id="fDl">Baixar .json</button><button class="b2" id="fOpen">Abrir arquivo…</button></div>
    <label class="f" for="fTxt">Cole um JSON aqui para importar</label><textarea class="in-t" id="fTxt" spellcheck="false">${esc(JSON.stringify(M))}</textarea>
    <div class="btns"><button class="b2 t" id="fImp">Importar do texto</button></div><p id="fMsg"></p>`;
    $('#fReset').onclick = () => { snap(); M = clone(MAPA_PADRAO); st.sel = null; commit(); fit(); };
    $('#fBlank').onclick = () => { snap(); M = { nome: 'Minha cidade', nodes: [], roads: [], evento: 5000, fundo: 'nenhum' }; st.sel = null; commit(); setTool('rua'); fit(); };
    $('#fBase').onchange = e => { M.fundo = e.target.checked ? '' : 'nenhum'; save(); drawBase(); };
    $('#fBg').onclick = () => $('#fileBg').click();
    if ($('#fBgX')) $('#fBgX').onclick = () => { st.bg = null; drawBg(); renderPane(); };
    if ($('#fOp')) $('#fOp').oninput = e => { st.bgOp = +e.target.value; drawBg(); };
    $('#fCopy').onclick = () => { try { navigator.clipboard.writeText(JSON.stringify(M, null, 1)).then(() => msg('JSON copiado.'), () => msg('Copie manualmente do campo abaixo.')); } catch (e) { msg('Copie manualmente do campo abaixo.'); } };
    $('#fDl').onclick = () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(M, null, 1)], { type: 'application/json' })); a.download = 'mapa-neonflow.json'; document.body.appendChild(a); a.click(); a.remove(); msg('Se o download não começar, use "Copiar JSON".'); } catch (e) { msg('Download bloqueado aqui — use "Copiar JSON".'); } };
    $('#fOpen').onclick = () => $('#fileJson').click();
    $('#fImp').onclick = () => importJSON($('#fTxt').value);
  }
}
const msg = t => { const m = $('#fMsg'); if (m) m.textContent = t; };
function flash(sel, t) { const b = $(sel); if (!b) return; const o = b.textContent; b.textContent = t; setTimeout(() => { if (b.isConnected) b.textContent = o; }, 1400); }
function bindRowSel(P) { P.querySelectorAll('tr[data-road]').forEach(t => t.onclick = () => { st.sel = { t: 'road', id: t.dataset.road }; drawMap(); }); }
function toggleAfetada(id) {
  const k = st.cenA.lista.findIndex(x => x.road === id);
  if (k >= 0) st.cenA.lista.splice(k, 1); else st.cenA.lista.push({ road: id, modo: 'interditar', pct: 50 });
}
function runA() {
  const L = st.cenA.lista.filter(x => road(x.road)); if (!L.length) return;
  st.cenA.res = cenarioA(M, L, st.metodo);
  st.cenA.res.cada = L.length > 1 ? L.map(x => ({ nome: road(x.road).name + ' (' + (x.modo === 'interditar' ? 'interditada' : '−' + x.pct + '%') + ')', pct: cenarioA(M, [x], st.metodo).perdaPct })) : null;
  st.cen = { tipo: 'A', lista: L.map(x => ({ ...x })) }; st.sel = null; st.passo = null;
  recompute(); renderAll();
}
function rankCrit() { return M.roads.map(r => ({ id: r.id, nome: r.name + ' — ' + curto(r.u) + ' ↔ ' + curto(r.v), pct: cenarioA(M, [{ road: r.id, modo: 'interditar' }], st.metodo).perdaPct })).filter(x => x.pct > 0).sort((a, b) => b.pct - a.pct); }
function runB() { st.cenB.res = cenarioB(M, st.cenB.X, st.metodo); st.cen = { tipo: 'B' }; st.passo = null; recompute(); renderAll(); }
function stopPlay() { if (st.play) clearInterval(st.play); st.play = null; }
function refreshStep() { drawMap(); hud(); const r = $('#pR'); if (r) r.value = st.passo; $$('#pane tr[data-step]').forEach(t => t.classList.toggle('best', +t.dataset.step === st.passo)); const b = $('#pPlay'); if (b) b.textContent = st.play ? 'Pausar' : '▶ Animar'; }
function importJSON(txt) {
  try { const m = JSON.parse(txt); if (!Array.isArray(m.nodes) || !Array.isArray(m.roads)) throw 0;
    m.nodes = m.nodes.map(n => ({ id: String(n.id), name: String(n.name || n.nome || n.id), x: +n.x, y: +n.y, role: n.role === 'src' || n.role === 'snk' ? n.role : '' }));
    const ids = new Set(m.nodes.map(n => n.id));
    m.roads = m.roads.map((r, i) => ({ id: String(r.id || 'r' + i), u: String(r.u), v: String(r.v), tipo: TIPOS[r.tipo] ? r.tipo : 'custom', cap: Math.max(0, +r.cap || 0), twoWay: !!r.twoWay, name: String(r.name || 'Rua') })).filter(r => ids.has(r.u) && ids.has(r.v));
    snap(); M = { nome: String(m.nome || 'Mapa importado'), nodes: m.nodes, roads: m.roads, evento: +m.evento || 0, fundo: m.fundo === 'nenhum' ? 'nenhum' : '' }; st.sel = null; commit(); fit(); msg('Mapa importado.');
  } catch (e) { msg('JSON inválido: esperado { nodes: [...], roads: [...] }.'); }
}
$('#fileJson').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(importJSON); e.target.value = ''; };
$('#fileBg').onchange = e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => { const w = 1000, h = w * im.naturalHeight / im.naturalWidth; st.bg = { url, x: 0, y: 0, w, h }; drawBg(); renderPane(); };
  im.src = url;
};

/* ---------------- roteamento ---------------- */
function renderAll() { drawBase(); drawBg(); drawMap(); hud(); renderTools(); renderTabs(); renderPane(); }
recompute(); renderAll(); requestAnimationFrame(fit);
}

</script>
</body>
</html>
